[project]
name = "trianglebvh"
version = "0.1.0"
description = "Clean-room triangle BVH with the cumesh.cuBVH unsigned_distance interface used by TRELLIS.2's GLB export; results bit-identical to cubvh's"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trianglebvh"]
